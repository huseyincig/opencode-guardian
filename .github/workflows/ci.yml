name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:strict
      - run: npm run lint
      - run: node scripts/check-docs.mjs
      - run: npm test
      - run: node sandbox/smoke-test.mjs
      - run: node sandbox/comprehensive-test.mjs
      # Published runtime dependencies must have no known advisories.
      - run: npm audit --omit=dev
      # The full dev audit remains visible and fails on any unexpected advisory.
      - run: node scripts/check-dev-audit.mjs
      - run: npm pack --dry-run

  cleanup-merged-branches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Delete merged PR branches
        uses: actions/github-script@v8
        with:
          script: |
            const cleanup = require('./scripts/cleanup-merged-branches.cjs')
            await cleanup({ github, context, core })
